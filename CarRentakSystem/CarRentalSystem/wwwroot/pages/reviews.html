<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>RoadKey — Reviews</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
          rel="stylesheet">

    <!-- RoadKey CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">

    <div class="brand">
        <span class="dot"></span>
        RoadKey
    </div>

    <div class="search flex-grow-1">
        <input class="form-control form-control-sm"
               placeholder="Search reviews..."
               id="searchInput">
    </div>

    <button class="btn btn-sm btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#reviewModal"
            onclick="openAddModal()">

        <i class="bi bi-plus-lg"></i>
        Add Review

    </button>

    <div class="avatar">
        M
    </div>

</div>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="side-group">

            <div class="side-label">
                Overview
            </div>

            <a class="side-link" href="../index.html">
                <i class="bi bi-grid-1x2"></i>
                Dashboard
            </a>

        </div>

        <div class="side-group">

            <div class="side-label">
                Fleet
            </div>

            <a class="side-link" href="cars.html">
                <i class="bi bi-car-front"></i>
                Cars
            </a>

            <a class="side-link" href="categories.html">
                <i class="bi bi-tags"></i>
                Categories
            </a>

            <a class="side-link" href="maintenance.html">
                <i class="bi bi-tools"></i>
                Maintenance
            </a>

            <a class="side-link" href="damage-reports.html">
                <i class="bi bi-exclamation-triangle"></i>
                Damage Reports
            </a>

        </div>

        <div class="side-group">

            <div class="side-label">
                People
            </div>

            <a class="side-link active" href="reviews.html">
                <i class="bi bi-star"></i>
                Reviews
            </a>

            <a class="side-link" href="users.html">
                <i class="bi bi-people"></i>
                Users
            </a>

        </div>

    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

        <div class="page-head">

            <div>

                <div class="eyebrow">
                    People
                </div>

                <h1 class="page-title">
                    Reviews
                </h1>

                <div class="page-sub">
                    Manage customer reviews and ratings.
                </div>

            </div>

        </div>

        <!-- MESSAGES -->
        <div id="messageContainer"></div>

        <!-- FILTER / SORT -->
        <div class="card p-3 mb-3">

            <div class="row g-2 align-items-end">

                <div class="col-md-4">

                    <label class="form-label">
                        Filter by Rating
                    </label>

                    <select class="form-select"
                            id="ratingFilter">

                        <option value="">
                            All Ratings
                        </option>

                        <option value="1">1 Star</option>
                        <option value="2">2 Stars</option>
                        <option value="3">3 Stars</option>
                        <option value="4">4 Stars</option>
                        <option value="5">5 Stars</option>

                    </select>

                </div>

                <div class="col-md-3">

                    <button class="btn btn-outline-secondary w-100"
                            onclick="filterReviews()">

                        <i class="bi bi-funnel me-1"></i>
                        Filter

                    </button>

                </div>

                <div class="col-md-3">

                    <button class="btn btn-outline-secondary w-100"
                            onclick="sortReviews()">

                        <i class="bi bi-sort-down me-1"></i>
                        Sort by Rating

                    </button>

                </div>

                <div class="col-md-2">

                    <button class="btn btn-outline-dark w-100"
                            onclick="loadReviews()">

                        <i class="bi bi-arrow-clockwise"></i>
                        Refresh

                    </button>

                </div>

            </div>

        </div>

        <!-- TABLE -->

        <div class="card p-3">

            <div class="d-flex justify-content-between align-items-center mb-3">

                <h2 style="font-size:16px;font-weight:700;margin:0;">
                    Reviews
                </h2>

                <span class="badge text-bg-secondary"
                      id="recordCount">

                        0 records

                    </span>

            </div>

            <div class="table-responsive">

                <table class="table align-middle">

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Date</th>
                        <th>Car</th>
                        <th>User</th>
                        <th>Rating</th>
                        <th>Comment</th>
                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody id="reviewsTableBody">

                    <tr>

                        <td colspan="7"
                            class="text-center py-5">

                            <div class="state-empty">

                                <i class="bi bi-hourglass-split"></i>

                                <div>
                                    Loading reviews...
                                </div>

                            </div>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<!-- MODAL -->

<div class="modal fade"
     id="reviewModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title"
                    id="modalTitle">

                    Add Review

                </h5>

                <button class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="reviewForm">

                    <input type="hidden"
                           id="reviewId">

                    <div class="mb-3">

                        <label class="form-label">
                            Review Date
                        </label>

                        <input type="date"
                               class="form-control"
                               id="reviewDate"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Comment
                        </label>

                        <textarea class="form-control"
                                  id="comment"
                                  required>
                            </textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Rating
                        </label>

                        <input type="number"
                               class="form-control"
                               id="rating"
                               min="1"
                               max="5"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Car ID
                        </label>

                        <input type="number"
                               class="form-control"
                               id="carId"
                               min="1"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            User ID
                        </label>

                        <input type="number"
                               class="form-control"
                               id="userId"
                               min="1"
                               required>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button class="btn btn-primary"
                        onclick="saveReview()">

                    Save

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/reviews.js"></script>

</body>
</html>
